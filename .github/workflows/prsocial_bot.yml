name: PR.Social 24/7 Automation Bot

on:
  schedule:
    # S'exécute automatiquement toutes les 25 minutes, 24h/24
    - cron: '*/25 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode d exécution'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - tasks
          - rejected
      max_minutes:
        description: 'Durée maximale en minutes'
        required: false
        default: '15'
        type: string

jobs:
  run-bot:
    name: Exécution Automatique PR.Social
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Récupération du Code
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installation des Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r cloud_deploy/requirements.txt

      - name: 🌐 Configuration de Google Chrome Headless
        run: |
          sudo apt-get update -y
          sudo apt-get install -y chromium-browser chromium-chromedriver

      - name: 🚀 Lancement du Bot Autonome
        env:
          PR_TOKEN: ${{ secrets.PR_TOKEN }}
          PR_CF_CLEARANCE: ${{ secrets.PR_CF_CLEARANCE }}
          RUN_MODE: ${{ github.event.inputs.mode || 'all' }}
          MAX_MINUTES: ${{ github.event.inputs.max_minutes || '15' }}
        run: |
          python cloud_deploy/github_runner.py
