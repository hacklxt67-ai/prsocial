version: '3.8'

services:
  lmarchande:
    build: .
    container_name: l_marchande_platform
    ports:
      - "8000:8000"
    restart: always
    environment:
      - L_MARCHANDE_SECRET=${L_MARCHANDE_SECRET:?Set a strong random L_MARCHANDE_SECRET in .env}
      - L_MARCHANDE_DB=/app/backend/l_marchande.db
    volumes:
      - lm_data:/app/backend

volumes:
  lm_data:
